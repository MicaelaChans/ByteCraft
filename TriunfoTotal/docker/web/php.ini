; Configuración de PHP endurecida para producción (TriunfoTotal)

; No mostrar errores al usuario (solo al log): evita filtrar rutas y datos internos
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; No revelar la versión de PHP en las cabeceras
expose_php = Off

; Sesiones seguras
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.gc_maxlifetime = 7200

; Límites (avatar en base64 ~2MB como máximo)
post_max_size = 4M
upload_max_filesize = 2M
memory_limit = 128M
max_execution_time = 30

; Funciones peligrosas deshabilitadas (la app no las usa)
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

date.timezone = America/Montevideo
