# =====================================================================
#  VirtualHost de TriunfoTotal (Apache 2.4)
#   - Puerto 80  -> redirige SIEMPRE a HTTPS
#   - Puerto 443 -> sitio con TLS 1.2/1.3 + cabeceras de seguridad
# =====================================================================

<VirtualHost *:80>
    ServerName ${SERVIDOR_NOMBRE}
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^([^:]+)
    RewriteRule ^ https://%1:${HTTPS_PUERTO}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ${SERVIDOR_NOMBRE}
    DocumentRoot /var/www/triunfo/public

    # --- TLS (cifrado de todo el tráfico) ---
    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/triunfo.crt
    SSLCertificateKeyFile /etc/apache2/ssl/triunfo.key
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off

    # --- Cabeceras de seguridad (OWASP) ---
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # --- API PHP: /api/<ruta> -> api/index.php (front controller) ---
    Alias /api /var/www/triunfo/api
    <Directory /var/www/triunfo/api>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteBase /api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # --- Frontend React (SPA): rutas desconocidas -> index.html ---
    <Directory /var/www/triunfo/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Nunca servir archivos ocultos (.env, .git, .htaccess...)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Logs (los lee fail2ban y el script de monitoreo)
    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
